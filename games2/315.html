<html lang="en-us">

    <style>
        html, body {
            margin: 0;

    </style>
</head>

<body>

<div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
</div>

<div id="custom-loader">
    <div class="progress-container">
        <div id="progress-fill"></div>
    </div>
    <div id="loader-status">0%</div>
</div>

<script>
"use strict";

const BASE = "https://cdn.jsdelivr.net/gh/thirstygithub/mibomboclat@main/";
const RAW_BASE = "https://raw.githubusercontent.com/thirstygithub/mibomboclat/main/";

const loaderStatus = document.getElementById("loader-status");
const progressFill = document.getElementById("progress-fill");
const customLoader = document.getElementById("custom-loader");

function updateProgress(percent) {
    if (percent !== null) {
        const p = Math.min(100, Math.max(0, Math.round(percent)));
        progressFill.style.width = p + "%";
        loaderStatus.innerText = p + "%";
    }
}

async function fetchFile(url) {
    const r = await fetch(url);

    if (!r.ok) {
        throw new Error("Failed: " + url);
    }

    return r.arrayBuffer();
}

async function fetchWithFallback(path) {
    try {
        return await fetchFile(BASE + path);
    } catch (e) {
        return await fetchFile(RAW_BASE + path);
    }
}

async function fetchChunks(
    baseName,
    startIndex,
    count,
    padDigits,
    progressStart,
    progressEnd
) {
    const buffers = [];
    let total = 0;

    for (let i = 0; i < count; i++) {
        const idx = startIndex + i;

        const padded =
            padDigits > 0
                ? String(idx).padStart(padDigits, "0")
                : String(idx);

        const path = baseName + ".part" + padded;

        updateProgress(
            progressStart +
            ((i / count) * (progressEnd - progressStart))
        );

        const buf = await fetchWithFallback(path);

        buffers.push(buf);
        total += buf.byteLength;
    }

    const out = new Uint8Array(total);

    let offset = 0;

    for (const b of buffers) {
        out.set(new Uint8Array(b), offset);
        offset += b.byteLength;
    }

    return out;
}

const preloadedAssets = {};

async function preloadStreamingPack(
    baseName,
    partCount,
    progressStart,
    progressEnd
) {
    const buffers = [];
    let total = 0;

    for (let i = 1; i <= partCount; i++) {
        const path = baseName + ".part" + i;

        updateProgress(
            progressStart +
            (((i - 1) / partCount) *
            (progressEnd - progressStart))
        );

        const buf = await fetchWithFallback(path);

        buffers.push(buf);
        total += buf.byteLength;
    }

    const out = new Uint8Array(total);

    let offset = 0;

    for (const b of buffers) {
        out.set(new Uint8Array(b), offset);
        offset += b.byteLength;
    }

    preloadedAssets[baseName] =
        URL.createObjectURL(
            new Blob([out], {
                type: "application/octet-stream"
            })
        );
}

/*
    Only intercept requests for the files that were
    actually split into .part files.

    Everything else goes through normal fetch().
*/

const originalFetch = window.fetch.bind(window);

window.fetch = function(input, init) {
    const url =
        typeof input === "string"
            ? input
            : input.url;

    for (const [key, blobUrl] of Object.entries(preloadedAssets)) {
        const fileName = key.split("/").pop();

        if (
            url.includes(fileName) &&
            !url.includes(".part")
        ) {
            return originalFetch(blobUrl, init);
        }
    }

    return originalFetch(input, init);
};

async function boot() {
    try {

        /*
            Split Build.data
        */

        const dataBytes = await fetchChunks(
            "Build/Build.data",
            1,
            21,
            2,
            0,
            30
        );

        const dataUrl =
            URL.createObjectURL(
                new Blob([dataBytes])
            );

        updateProgress(33);

        /*
            Framework
        */

        const fwBuf =
            await fetchWithFallback(
                "Build/Build.framework.js"
            );

        const fwText =
            new TextDecoder().decode(fwBuf);

        const fwScript =
            document.createElement("script");

        fwScript.textContent = fwText;

        document.head.appendChild(fwScript);

        updateProgress(35);

        /*
            Split WASM
        */

        const wasmBytes =
            await fetchChunks(
                "Build/Build.wasm",
                1,
                3,
                0,
                35,
                50
            );

        const wasmUrl =
            URL.createObjectURL(
                new Blob(
                    [wasmBytes],
                    {
                        type: "application/wasm"
                    }
                )
            );

        /*
            StreamingAssets
        */

        await preloadStreamingPack(
            "StreamingAssets/ksp/core.000.pack",
            3,
            50,
            65
        );

        await preloadStreamingPack(
            "StreamingAssets/ksp/core.001.pack",
            2,
            65,
            75
        );

        updateProgress(78);

        const canvas =
            document.querySelector("#unity-canvas");

        const config = {
            arguments: [],

            dataUrl: dataUrl,

            frameworkUrl:
                BASE + "Build/Build.framework.js",

            codeUrl: wasmUrl,

            streamingAssetsUrl:
                BASE + "StreamingAssets/",

            companyName: "Squad",

            productName:
                "Kerbal Space Program",

            productVersion: "1.0"
        };

        updateProgress(80);


        const loaderBuf =
            await fetchWithFallback(
                "Build/Build.loader.js"
            );

        const loaderText =
            new TextDecoder().decode(loaderBuf);

        const loaderScript =
            document.createElement("script");

        loaderScript.textContent =
            loaderText;

        document.head.appendChild(loaderScript);

        updateProgress(85);


        createUnityInstance(
            canvas,
            config,
            (progress) => {
                updateProgress(
                    85 + (progress * 15)
                );
            }
        )
        .then((unityInstance) => {

            updateProgress(100);

            customLoader.style.opacity = "0";

            setTimeout(() => {
                customLoader.style.display = "none";
            }, 300);

        })
        .catch((message) => {

            loaderStatus.innerText = "Error";

            console.error(message);

            alert(message);
        });

    } catch (err) {

        loaderStatus.innerText = "Error";

        console.error(err);
    }
}

boot();
</script>

</body>
</html>
