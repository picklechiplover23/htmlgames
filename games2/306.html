<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    <base href="https://cdn.jsdelivr.net/gh/CoolDude2349/everything@main/crazymotor/">

    <style>
        html, body {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }

        .fullscreen {
            background: #383838;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        #banner-container {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 90px;
        }

        #loading-overlay {
            font-size: 20px;
            z-index: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #icon {
            max-width: 120px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        #progress-bar {
            border-radius: 5px;
            width: 90%;
            max-width: 250px;
            height: 20px;
            background: #242424;
            padding: 5px;
        }

        #progress-bar-fill {
            border-radius: 3px;
            width: 0%;
            height: 100%;
            background: #FF9A00;
        }
    </style>
</head>

<body>
    <canvas id="canvas" class="fullscreen"></canvas>

    <div id="banner-container" style="display: none"></div>

    <div id="loading-overlay" class="fullscreen">
        <img id="icon" src="./icon.png">
        <div id="progress-bar">
            <div id="progress-bar-fill"></div>
        </div>
    </div>

    <script>
        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            const meta = document.createElement('meta');
            meta.name = 'viewport';
            meta.content =
                'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
            document.head.appendChild(meta);
        }

        const canvas = document.getElementById('canvas');
        const loadingOverlay = document.getElementById('loading-overlay');
        const progressBarFill = document.getElementById('progress-bar-fill');
        const bannerContainer = document.getElementById('banner-container');

        const STORAGE_DATA_SEPARATOR = '{bridge_data_separator}';
        const STORAGE_KEYS_SEPARATOR = '{bridge_keys_separator}';
        const STORAGE_VALUES_SEPARATOR = '{bridge_values_separator}';

        window.unityInstance = null;

        let progressBarFillingInterval = null;

        function sendMessageToUnity(name, value) {
            if (window.unityInstance !== null) {
                window.unityInstance.SendMessage('Bridge', name, value);
            }
        }

        function onUnityLoadingProgressChanged(progress) {
            if (progress === 0.9) {
                completeProgressBarFilling();
                return;
            }

            progressBarFill.style.width = `${progress * 100}%`;

            if (progress === 1 && progressBarFillingInterval !== null) {
                clearInterval(progressBarFillingInterval);
                progressBarFillingInterval = null;
            }
        }

        function completeProgressBarFilling() {
            if (progressBarFillingInterval !== null) {
                return;
            }

            let currentPercent = 90;

            progressBarFill.style.width = `${currentPercent}%`;

            progressBarFillingInterval = setInterval(() => {
                currentPercent++;

                if (currentPercent > 100) {
                    currentPercent = 100;
                }

                progressBarFill.style.width = `${currentPercent}%`;

                if (currentPercent >= 100) {
                    clearInterval(progressBarFillingInterval);
                    progressBarFillingInterval = null;
                }
            }, 100);
        }

        window.addEventListener('pointerdown', () => {
            window.focus();
            canvas.focus();
        });

        function loadBridge() {
            return new Promise((resolve, reject) => {
                if (typeof window.bridge !== 'undefined') {
                    resolve();
                    return;
                }

                const bridgeScript = document.createElement('script');

                bridgeScript.src =
                    'https://cdn.jsdelivr.net/gh/CoolDude2349/everything@main/crazymotor/instant-games-bridge.js';

                bridgeScript.onload = () => {
                    if (typeof window.bridge === 'undefined') {
                        reject(new Error(
                            'instant-games-bridge.js loaded but window.bridge was not created.'
                        ));
                        return;
                    }

                    resolve();
                };

                bridgeScript.onerror = () => {
                    reject(new Error(
                        'Failed to load instant-games-bridge.js'
                    ));
                };

                document.head.appendChild(bridgeScript);
            });
        }

        async function startGame() {
            try {
                await loadBridge();

                const bridgeOptions = {
                    platforms: {
                        game_distribution: {
                            gameId: '30637801603e46ec82b342b77f539cf3'
                        }
                    }
                };

                await bridge.initialize(bridgeOptions);

                bridge.advertisement.on(
                    'banner_state_changed',
                    state => sendMessageToUnity('OnBannerStateChanged', state)
                );

                bridge.advertisement.on(
                    'interstitial_state_changed',
                    state => sendMessageToUnity('OnInterstitialStateChanged', state)
                );

                bridge.advertisement.on(
                    'rewarded_state_changed',
                    state => sendMessageToUnity('OnRewardedStateChanged', state)
                );

                bridge.game.on(
                    'visibility_state_changed',
                    state => sendMessageToUnity('OnVisibilityStateChanged', state)
                );

                if (
                    bridge.platform.id === bridge.PLATFORM_ID.YANDEX ||
                    bridge.platform.id === bridge.PLATFORM_ID.GAME_DISTRIBUTION
                ) {
                    bridge.advertisement.showInterstitial();
                }

                const unityLoader = document.createElement('script');

                unityLoader.src =
                    'Build/Build_Motorcycle.loader2.js';

                unityLoader.onload = () => {
                    if (typeof createUnityInstance !== 'function') {
                        console.error(
                            'createUnityInstance is not defined after loading the Unity loader.'
                        );
                        return;
                    }

                    createUnityInstance(
                        canvas,
                        {
                            dataUrl: 'Build/Build_Motorcycle.data.unityweb',

                            frameworkUrl:
                                'Build/Build_Motorcycle.framework.js.unityweb',

                            codeUrl:
                                'Build/Build_Motorcycle.wasm.unityweb',

                            streamingAssetsUrl:
                                'StreamingAssets',

                            companyName: 'AM',
                            productName: 'nubik-motorcycle',
                            productVersion: '0.2'
                        },
                        onUnityLoadingProgressChanged
                    )
                    .then(unityInstance => {
                        window.unityInstance = unityInstance;

                        loadingOverlay.remove();

                        canvas.focus();
                    })
                    .catch(error => {
                        console.error(
                            'Unity initialization failed:',
                            error
                        );
                    });
                };

                unityLoader.onerror = () => {
                    console.error(
                        'Failed to load Unity loader:',
                        unityLoader.src
                    );
                };

                document.body.appendChild(unityLoader);

            } catch (error) {
                console.error(
                    'Game initialization failed:',
                    error
                );
            }
        }


        window.getPlatformId = function() {
            return bridge.platform.id;
        };

        window.getPlatformLanguage = function() {
            return bridge.platform.language;
        };

        window.getPlatformPayload = function() {
            const payload = bridge.platform.payload;

            if (typeof payload === 'string') {
                return payload;
            }

            return '';

        window.getPlatformTld = function() {

            if (typeof tld === 'string') {

        window.sendMessageToPlatform = function(message) {
            bridge.platform.sendMessage(message);
        };



        window.getDeviceType = function() {
            return bridge.device.type;
        };


        window.getIsPlayerAuthorizationSupported = function() {
            return bridge.player.isAuthorizationSupported.toString();
        };

        window.getIsPlayerAuthorized = function() {
            return bridge.player.isAuthorized.toString();
        };

        window.getPlayerId = function() {
            if (bridge.player.id) {
                return bridge.player.id.toString();
            }

            return '';
        };

        window.getPlayerName = function() {
            if (bridge.player.name) {
                return bridge.player.name.toString();
            }

            return '';
        };

        window.getPlayerPhotos = function() {
            if (bridge.player.photos.length > 0) {
                return JSON.stringify(bridge.player.photos);
            }

            return '';
        };

        window.authorizePlayer = function(options) {
            if (options) {
                options = JSON.parse(options);
            }

            bridge.player.authorize(options)
                .then(() => {
                    sendMessageToUnity(
                        'OnAuthorizeCompleted',
                        'true'
                    );
                })
                .catch(() => {
                    sendMessageToUnity(
                        'OnAuthorizeCompleted',
                        'false'
                    );
                });
        };


        window.getVisibilityState = function() {
            return bridge.game.visibilityState;
        };



        window.getStorageDefaultType = function() {
            return bridge.storage.defaultType;
        };

        window.getIsStorageSupported = function(storageType) {
            return bridge.storage.isSupported(storageType).toString();
        };

        window.getIsStorageAvailable = function(storageType) {
            return bridge.storage.isAvailable(storageType).toString();
        };

        window.getStorageData = function(key, storageType) {
            const keys = key.split(STORAGE_KEYS_SEPARATOR);

            bridge.storage.get(keys, storageType)
                .then(data => {
                    if (keys.length > 1) {
                        const values = [];

                        for (let i = 0; i < keys.length; i++) {
                            let value = data[i];

                            if (value) {
                                if (typeof value !== 'string') {
                                    value = JSON.stringify(value);
                                }

                                values.push(value);
                            } else {
                                values.push('');
                            }
                        }

                        sendMessageToUnity(
                            'OnGetStorageDataSuccess',
                            `${key}${STORAGE_DATA_SEPARATOR}${values.join(STORAGE_VALUES_SEPARATOR)}`
                        );
                    } else {
                        if (data[0]) {
                            if (typeof data[0] !== 'string') {
                                data = JSON.stringify(data[0]);
                            }
                        } else {
                            data = '';
                        }

                        sendMessageToUnity(
                            'OnGetStorageDataSuccess',
                            `${key}${STORAGE_DATA_SEPARATOR}${data}`
                        );
                    }
                })
                .catch(() => {
                    sendMessageToUnity(
                        'OnGetStorageDataFailed',
                        key
                    );
                });
        };

        window.setStorageData = function(key, value, storageType) {
            const keys = key.split(STORAGE_KEYS_SEPARATOR);
            const values = value.split(STORAGE_VALUES_SEPARATOR);

            bridge.storage.set(keys, values, storageType)
                .then(() => {
                    sendMessageToUnity(
                        'OnSetStorageDataSuccess',
                        key
                    );
                })
                .catch(() => {
                    sendMessageToUnity(
                        'OnSetStorageDataFailed',
                        key
                    );
                });
        };

        window.deleteStorageData = function(key, storageType) {
            const keys = key.split(STORAGE_KEYS_SEPARATOR);

            bridge.storage.delete(keys, storageType)
                .then(() => {
                    sendMessageToUnity(
                        'OnDeleteStorageDataSuccess',
                        key
                    );
                })
                .catch(() => {
                    sendMessageToUnity(
                        'OnDeleteStorageDataFailed',
                        key
                    );
                });
        };


        window.getInterstitialState = function() {
            if (bridge.advertisement.interstitialState) {
                return bridge.advertisement.interstitialState;
            }

            return '';
        };

        window.getIsBannerSupported = function() {
            return bridge.advertisement.isBannerSupported.toString();
        };

        window.getMinimumDelayBetweenInterstitial = function() {
            return bridge.advertisement.minimumDelayBetweenInterstitial.toString();
        };

        window.setMinimumDelayBetweenInterstitial = function(options) {
            if (options) {
                options = JSON.parse(options);
            } else {
                options = {};
            }

            bridge.advertisement.setMinimumDelayBetweenInterstitial(options);
        };

        window.showBanner = function(options) {
            if (options) {
                options = JSON.parse(options);
            } else {
                options = {};
            }

            if (
                bridge.platform.id === bridge.PLATFORM_ID.CRAZY_GAMES ||
                bridge.platform.id === bridge.PLATFORM_ID.GAME_DISTRIBUTION
            ) {
                bannerContainer.style.display = 'block';
            }

            options.crazy_games = {
                containerId: 'banner-container'
            };

            options.game_distribution = {
                containerId: 'banner-container'
            };

            bridge.advertisement.showBanner(options);
        };

        window.hideBanner = function() {
            if (
                bridge.platform.id === bridge.PLATFORM_ID.CRAZY_GAMES ||
                bridge.platform.id === bridge.PLATFORM_ID.GAME_DISTRIBUTION
            ) {
                bannerContainer.style.display = 'none';
            }

            bridge.advertisement.hideBanner();
        };

        window.paymentsGetCatalog = function() {
            bridge.payments.getCatalog()
                .then(data => {
                    if (data) {
                        if (typeof data !== 'string') {
                            data = JSON.stringify(data);
                        }

                        data = data.replaceAll('imageURI', 'icon');

                        sendMessageToUnity(
                            'OnPaymentsGetCatalogCompletedSuccess',
                            data
                        );
                    } else {
                        sendMessageToUnity(

                .then(data => {
                    if (data) {
                        if (typeof data !== 'string') {
                            data = JSON.stringify(data);
                        }

                        data = data.replaceAll('productID', 'id');
                        data = data.replaceAll('purchaseToken', 'token');

                        sendMessageToUnity(

        window.getIsRemoteConfigSupported = function() {
            return bridge.remoteConfig.isSupported.toString();
        };

        window.remoteConfigGet = function(options) {
            if (options) {
                options = JSON.parse(options);
            } else {
                options = {
                    clientFeatures: []
                };
            }

            bridge.remoteConfig.get(options)
                .then(data => {
                    const keys = Object.keys(data);
                    const values = [];

                    for (let i = 0; i < keys.length; i++) {
                        const name = keys[i];
                        const value = data[name];

                        values.push({
                            name,
                            value
                        });
                    }

                    sendMessageToUnity(
                        'OnRemoteConfigGetSuccess',
                        JSON.stringify(values)
                    );
                })
                .catch(() => {
                    sendMessageToUnity(
                        'OnRemoteConfigGetFailed',
                        ''
                    );
                });
        };
