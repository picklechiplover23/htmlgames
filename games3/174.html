<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cuphead</title>
    <base
      href="https://cdn.jsdelivr.net/gh/SomeRandomFella/portsandrips@master/cuphead/"
    />
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; }
      body { background: #111; color: #eee; font: 16px Arial, sans-serif; }
      #unity-canvas { display: block; width: 100vw; height: 100vh; }
      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #111;
        z-index: 1;
      }
      #loading-content { width: min(340px, calc(100vw - 40px)); }
      #loading-title { margin: 0 0 12px; font-size: 20px; font-weight: normal; }
      #loading-status { margin: 0 0 12px; color: #bbb; font-size: 14px; }
      #loading-progress { display: block; width: 100%; height: 12px; }
    </style>
  </head>
  <body>
    <div id="loading" role="status" aria-live="polite">
      <div id="loading-content">
        <h1 id="loading-title">Loading Cuphead</h1>
        <p id="loading-status">Preparing files...</p>
        <progress id="loading-progress" max="1" value="0"></progress>
      </div>
    </div>
    <canvas id="unity-canvas"></canvas>
    <script src="Build/Cuphead.loader.js"></script>
    <script>
      const canvas = document.getElementById('unity-canvas');
      const loading = document.getElementById('loading');
      const status = document.getElementById('loading-status');
      const progress = document.getElementById('loading-progress');

      // Each build part is at most 19,000,000 bytes. Keep these counts in sync
      // with the files in Build/ when repacking the Unity build.
      const builds = [
        { name: 'data', count: 71, type: 'application/octet-stream' },
        { name: 'wasm', count: 2, type: 'application/wasm' }
      ];
      const totalParts = builds.reduce((sum, build) => sum + build.count, 0);
      let completedParts = 0;

      async function loadBuild(build) {
        const parts = [];
        for (let i = 1; i <= build.count; i++) {
          const partName = `${build.name}.part${String(i).padStart(3, '0')}`;
          status.textContent = `Loading ${build.name} part ${i} of ${build.count} (${completedParts} of ${totalParts} parts complete)`;
          const response = await fetch(`Build/Cuphead.${partName}`);
          if (!response.ok) throw new Error(`Could not load ${partName} (HTTP ${response.status})`);
          parts.push(await response.blob());
          completedParts++;
          progress.value = 0.9 * completedParts / totalParts;
        }
        return URL.createObjectURL(new Blob(parts, { type: build.type }));
      }

      (async () => {
        let dataUrl;
        let codeUrl;
        try {
          dataUrl = await loadBuild(builds[0]);
          codeUrl = await loadBuild(builds[1]);
          status.textContent = 'Starting game...';
          await createUnityInstance(canvas, {
            dataUrl,
            frameworkUrl: 'Build/Cuphead.framework.js',
            codeUrl,
            streamingAssetsUrl: 'StreamingAssets',
            companyName: 'crackers',
            productName: 'Cuphead',
            productVersion: '1.0'
          }, unityProgress => {
            progress.value = 0.9 + 0.1 * unityProgress;
          });
          loading.remove();
        } catch (error) {
          console.error(error);
          status.textContent = `Loading failed: ${error.message || error}`;
        } finally {
          if (dataUrl) URL.revokeObjectURL(dataUrl);
          if (codeUrl) URL.revokeObjectURL(codeUrl);
        }
      })();
    </script>
  </body>
</html>
